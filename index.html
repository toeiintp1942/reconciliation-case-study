<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reconciliation System · Interactive Demo</title>
<style>
:root{--ink:#0F172A;--ink2:#1E293B;--muted:#64748B;--mutedLite:#94A3B8;--line:#E2E8F0;--lineLite:#F1F5F9;--bg:#F8FAFC;--card:#fff;
--brand:#10B981;--brand-dark:#059669;--brand-tint:#D1FAE5;--blue:#0EA5E9;--blue-tint:#E0F2FE;--amber:#F59E0B;--amber-tint:#FEF3C7;
--red:#DC2626;--red-tint:#FEE2E2;--purple:#8B5CF6;--purple-tint:#EDE9FE;--r:10px;--rl:14px;
--font:'Inter','Segoe UI','Noto Sans Thai',-apple-system,Arial,sans-serif;--mono:'JetBrains Mono',Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0}body{font:13.5px/1.55 var(--font);color:var(--ink);background:var(--bg)}
.app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:56px 1fr;min-height:100vh;grid-template-areas:"side hdr" "side main"}
.hdr{grid-area:hdr;position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px}
.hdr h1{font-size:16px;margin:0;font-weight:700}.hdr .crumb{color:var(--muted);font-size:12.5px}
.hdr .sp{flex:1}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.demo-pill{background:var(--amber-tint);color:#92400E}.icon-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;background:#fff;cursor:pointer;position:relative}
.icon-btn svg{width:17px;height:17px;stroke:var(--ink2);fill:none;stroke-width:1.8}.dot{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;border-radius:999px;padding:0 5px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.ham{display:none}
.side{grid-area:side;background:#fff;border-right:1px solid var(--line);padding:14px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;border-bottom:1px solid var(--lineLite);margin-bottom:10px}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0F172A,#334155);display:grid;place-items:center}
.mark svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
.brand b{display:block;font-size:14px}.brand small{color:var(--muted);font-size:11.5px}
.grp{margin-top:8px}.gh{display:flex;align-items:center;gap:9px;padding:7px 10px;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border-radius:8px}
.gh:hover{background:var(--lineLite)}.gh .chev{margin-left:auto;transition:.15s}.grp.closed .chev{transform:rotate(-90deg)}.grp.closed .items{display:none}
.it{display:flex;align-items:center;gap:9px;padding:7px 10px 7px 14px;border-radius:8px;cursor:pointer;color:var(--ink2);font-size:13px}
.it:hover{background:var(--lineLite)}.it.on{background:var(--brand-tint);color:#065F46;font-weight:600}
.it svg,.gh svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;flex:0 0 auto}
.main{grid-area:main;padding:22px;max-width:1280px;width:100%;min-width:0}.bar .inp{max-width:100%}
.lead{background:#fff;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--r);padding:11px 14px;margin-bottom:16px;color:var(--muted)}
.lead b{color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--rl);padding:18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--rl);padding:14px 16px}
.kpi .l{color:var(--muted);font-size:12px}.kpi .v{font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}.kpi .s{font-size:11.5px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.inp,select.inp{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit;background:#fff;color:var(--ink);min-width:0}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--mutedLite)}.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:12.8px}th,td{padding:8px 10px;border-bottom:1px solid var(--lineLite);text-align:left;white-space:nowrap}
th{background:var(--bg);color:var(--muted);font-weight:600;position:sticky;top:0}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#FAFCFE}.mono{font-family:var(--mono);font-size:12px}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600}
.c-ok{background:#ECFDF5;color:#047857}.c-diff{background:var(--red-tint);color:#B91C1C}.c-warn{background:var(--amber-tint);color:#92400E}
.c-info{background:var(--blue-tint);color:#0369A1}.c-pur{background:var(--purple-tint);color:#6D28D9}.c-grey{background:var(--lineLite);color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tab{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:12.5px}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.drop{border:2px dashed var(--line);border-radius:var(--rl);padding:26px;text-align:center;color:var(--muted);background:#fff}
.drop b{color:var(--ink)}.muted{color:var(--muted)}.small{font-size:12px}
.mcard{border:1px solid var(--line);border-radius:var(--rl);padding:14px;background:#fff}
.mcard .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.prog{height:6px;background:var(--lineLite);border-radius:9px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--brand)}
.tog{width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;display:inline-block;cursor:pointer;vertical-align:middle}
.tog.on{background:var(--brand)}.tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.tog.on::after{left:18px}
.notice{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;gap:12px}
.notice .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;font-weight:700}
.row{display:grid;grid-template-columns:170px 1fr;gap:8px 14px;align-items:center;margin:8px 0}.row .l{color:var(--muted);font-size:12.5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:99;font-size:13px;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.chart svg{width:100%;height:auto;display:block}
.slip{border:1px solid var(--line);border-radius:10px;padding:10px;background:linear-gradient(#fff,#F8FAFC);font-size:12px}
.slip .amt{font-size:18px;font-weight:700}
.sig{height:46px;border-bottom:1px dashed var(--mutedLite);display:flex;align-items:flex-end;justify-content:center;font-family:'Segoe Script','Brush Script MT',cursive;font-size:20px;color:#1E3A8A}
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;padding:22px 26px;box-shadow:0 6px 16px rgba(15,23,42,.06);font-size:12.5px}
.paper h4{text-align:center;margin:0 0 10px;font-size:15px}
.drawer-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.app{grid-template-columns:minmax(0,1fr);grid-template-areas:"hdr" "main"}.side{position:fixed;left:-270px;width:260px;z-index:50;transition:.2s}
.side.open{left:0}.drawer-bg.open{display:block}.ham{display:grid}.grid2,.grid3{grid-template-columns:1fr}.main{padding:16px}.hdr{padding:0 16px}.hide-m{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
  <div class="brand"><div class="mark"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
  <div><b>Recon System</b><small>Interactive demo · mock data</small></div></div>
  <div id="nav"></div>
</aside>
<div class="drawer-bg" id="dbg" onclick="side(false)"></div>
<header class="hdr">
  <div class="icon-btn ham" onclick="side(true)"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></div>
  <div><h1 id="ttl">Home</h1><div class="crumb" id="crumb"></div></div>
  <div class="sp"></div>
  <span class="pill demo-pill hide-m">Demo · actions disabled</span>
  <div class="icon-btn" onclick="demo('Export queue: files appear here when ready')" title="Export queue"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dot">2</span></div>
  <div class="avatar" title="Demo Admin">DA</div>
</header>
<main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
/* ───────── mock data (all fictional) ───────── */
let seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const pick=a=>a[Math.floor(R()*a.length)];const rint=(a,b)=>Math.floor(a+R()*(b-a+1));
const f2=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const f0=n=>Number(n).toLocaleString('en-US');
const BR=Array.from({length:12},(_,i)=>({code:'S'+String(101+i).padStart(4,'0'),name:'Store '+String(101+i).padStart(3,'0'),
  area:pick(['Bangkok','Bangkok','Chiang Mai','Phuket','Khon Kaen']),mall:i%3===0}));
const d=(i)=>`2026-10-${String(i).padStart(2,'0')}`;
const chip=(t,c)=>`<span class="chip ${c}">${t}</span>`;
const ST={OK:'c-ok',Diff:'c-diff','Select IV':'c-pur','Unknown branch':'c-warn','Prior month':'c-grey','Waiting platform':'c-info','No IV':'c-diff'};
function table(cols,rows,max){return `<div class="tw" style="${max?`max-height:${max}px`:''}"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}">${c.t}</th>`).join('')}</tr></thead><tbody>${
 rows.map(r=>`<tr>${cols.map((c,i)=>`<td class="${c.n?'n':''} ${c.m?'mono':''}">${r[i]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const kpis=a=>`<div class="kpis">${a.map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v" style="${k[3]?`color:${k[3]}`:''}">${k[1]}</div><div class="s">${k[2]||''}</div></div>`).join('')}</div>`;
const B=(t,c='')=>`<button class="btn ${c}" onclick="demo()">${t}</button>`;
const sel=(o)=>`<select class="inp">${o.map(x=>`<option>${x}</option>`).join('')}</select>`;
const search=(p='Search…')=>`<input class="inp" placeholder="${p}" oninput="filt(this)" style="width:220px">`;
const lead=(t)=>`<div class="lead">${t}</div>`;
function filt(inp){const tb=inp.closest('.card')?.querySelector('tbody');if(!tb)return;const q=inp.value.toLowerCase();
 tb.querySelectorAll('tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none')}
function tabs(id,names,fn){TABF[id]=fn;return `<div class="tabs" data-tabs="${id}">${names.map((n,i)=>`<span class="tab ${i?'':'on'}" onclick="tabGo(this,'${id}',${i})">${n}</span>`).join('')}</div><div id="${id}">${fn(0)}</div>`}
const TABF={};function tabGo(el,id,i){el.parentNode.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',j===i));document.getElementById(id).innerHTML=TABF[id](i)}
function lineChart(series,labels,colors,h=220){const W=760,H=h,p=34;const all=series.flat();const mx=Math.max(...all)*1.1;
 const x=i=>p+i*(W-p*2)/(labels.length-1),y=v=>H-p-(v/mx)*(H-p*2);
 let g='';for(let k=0;k<=4;k++){const yy=p+k*(H-p*2)/4;g+=`<line x1="${p}" x2="${W-p}" y1="${yy}" y2="${yy}" stroke="#F1F5F9"/><text x="4" y="${yy+4}" font-size="10" fill="#94A3B8">${f0(Math.round(mx*(1-k/4)/1000))}k</text>`}
 labels.forEach((l,i)=>{if(i%3===0)g+=`<text x="${x(i)}" y="${H-10}" font-size="10" fill="#94A3B8" text-anchor="middle">${l}</text>`});
 series.forEach((s,si)=>{g+=`<polyline fill="none" stroke="${colors[si]}" stroke-width="2.2" points="${s.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`});
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`}
function barChart(vals,labels,color='#10B981',h=200){const W=760,H=h,p=30;const mx=Math.max(...vals)*1.1;const bw=(W-p*2)/vals.length;
 let g='';vals.forEach((v,i)=>{const bh=(v/mx)*(H-p*2);g+=`<rect x="${p+i*bw+4}" y="${H-p-bh}" width="${bw-8}" height="${bh}" rx="4" fill="${color}"/><text x="${p+i*bw+bw/2}" y="${H-12}" font-size="10" fill="#94A3B8" text-anchor="middle">${labels[i]}</text>`});
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`}
function donut(parts){let a=0,g='';const tot=parts.reduce((s,p)=>s+p[1],0);parts.forEach(p=>{const fr=p[1]/tot,L=2*Math.PI*60;
 g+=`<circle r="60" cx="80" cy="80" fill="none" stroke="${p[2]}" stroke-width="22" stroke-dasharray="${fr*L} ${L}" stroke-dashoffset="${-a*L}" transform="rotate(-90 80 80)"/>`;a+=fr});
 return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg width="160" height="160">${g}</svg><div>${parts.map(p=>`<div style="margin:4px 0"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${p[2]};margin-right:6px"></span>${p[0]} · <b>${f0(p[1])}</b> <span class="muted">(${(p[1]/tot*100).toFixed(1)}%)</span></div>`).join('')}</div></div>`}

/* ───────── pages ───────── */
const days=Array.from({length:31},(_,i)=>i+1);
const sales=days.map(()=>rint(880,1180)*1000),ivx=sales.map(v=>v-rint(0,6)*1000);
const P={};
P.home=()=>lead('<b>Home</b> — announcements, closing-period reminders and shortcuts. Important notices pop up after login.')+
 kpis([['Closing period','Oct 2026','Due 13 Nov 2026'],['Bank lines this month','13,611','Auto-matched 95.6%','#059669'],['Pending review','597','Diff · Select IV · Unknown branch','#B45309'],['Export queue','2 ready','Download from the bell']])+
 `<div class="grid2"><div class="card"><h3>Announcements</h3>
 <div class="notice"><div class="ic" style="background:var(--red-tint);color:#B91C1C">!</div><div><b>Month-end close · Oct 2026</b><div class="muted small">Upload bank statements and platform files by 13/11/2026</div></div></div>
 <div class="notice"><div class="ic" style="background:var(--blue-tint);color:#0369A1">i</div><div><b>New: Mall Billing module</b><div class="muted small">Generate summary, receipt and sales report PDFs per mall contract</div></div></div>
 <div class="notice"><div class="ic" style="background:var(--brand-tint);color:#047857">✓</div><div><b>Weekly encrypted backup</b><div class="muted small">Every Friday 19:00 · last run OK</div></div></div></div>
 <div class="card"><h3>Shortcuts</h3><div class="grid2">${['Bank Statement','IVxGL vs POS','Grab','Mall Billing','WHT','Reports & Export'].map(s=>`<button class="btn" onclick="go('${{'Bank Statement':'bankstmt','IVxGL vs POS':'ivxgl','Grab':'grab','Mall Billing':'mallbill','WHT':'doc_wht','Reports & Export':'reports'}[s]}')">${s} →</button>`).join('')}</div></div></div>`;
P.dashboard=()=>lead('<b>Dashboard</b> — month-at-a-glance reconciliation status across all channels.')+
 kpis([['POS sales (Oct)',f0(sales.reduce((a,b)=>a+b))],['Invoiced (IVxGL)',f0(ivx.reduce((a,b)=>a+b))],['Matched to bank','95.6%','13,014 / 13,611','#059669'],['Not yet OK','597','with reason / needs review','#B91C1C']])+
 `<div class="grid2"><div class="card"><h3>Bank lines by status</h3>${donut([['OK',13014,'#10B981'],['Prior month',294,'#94A3B8'],['Waiting platform',121,'#0EA5E9'],['Diff',82,'#DC2626'],['Unknown branch',58,'#F59E0B'],['Select IV',42,'#8B5CF6']])}</div>
 <div class="card"><h3>Sales by channel (% of sales)</h3>${donut([['Cash',31,'#0F172A'],['QR / Transfer',38,'#10B981'],['Card (EDC)',14,'#0EA5E9'],['Grab',9,'#22C55E'],['LINE MAN',5,'#84CC16'],['ShopeeFood',3,'#F97316']])}</div></div>`;
P.salesdash=()=>lead('<b>Sales</b> — daily sales trend, POS vs invoices, by branch and channel.')+
 `<div class="card"><div class="bar">${sel(['Oct 2026','Sep 2026'])}${sel(['All branches',...BR.map(b=>b.name)])}${sel(['All channels','Cash','QR','Card','Grab','LINE MAN','ShopeeFood'])}</div>${lineChart([sales,ivx],days.map(String),['#10B981','#0F172A'])}
 <div class="small muted">● POS sales &nbsp; ● Invoiced (IVxGL)</div></div>
 <div class="card"><h3>Top branches</h3>${table([{t:'Branch'},{t:'Area'},{t:'POS',n:1},{t:'Invoiced',n:1},{t:'Diff',n:1}],BR.slice(0,8).map(b=>{const v=rint(800,2400)*1000,df=R()<.25?rint(1,9)*10:0;return[b.code+' · '+b.name,b.area,f2(v),f2(v-df),df?`<span style="color:#B91C1C">${f2(-df)}</span>`:'0.00']}))}</div>`;
P.salesrec=()=>lead('<b>Sale Report</b> — save daily sales snapshots by branch so later uploads can be compared, reverted or audited.')+
 `<div class="card"><div class="bar">${B('Save snapshot','pri')}${B('Revert batch')}${search()}</div>${table([{t:'Batch'},{t:'Saved by'},{t:'Period'},{t:'Branches',n:1},{t:'New rows',n:1},{t:'Replaced',n:1}],
 [6,5,4,3,2,1].map(i=>['#'+i,pick(['user2','Admin','user3']),`2026-${String(5+i).padStart(2,'0')}-01 → ${String(5+i).padStart(2,'0')}-30`,rint(150,178),f0(rint(4000,5400)),rint(0,40)]))}</div>`;
P.void=()=>lead('<b>Void</b> — imports POS void/cancel reports, flags duplicates and summarises by branch, cashier and reason.')+
 kpis([['Void bills (Oct)','582'],['Void amount','46,210.00'],['Possible duplicates','7','same bill, same amount','#B45309'],['Top reason','Wrong item']])+
 `<div class="card"><div class="bar">${search('Search bill / branch')}${sel(['All reasons','Wrong item','Customer cancelled','Discount not applied'])}</div>${table([{t:'Date'},{t:'Time'},{t:'Branch'},{t:'Bill no.',m:1},{t:'By'},{t:'Reason'},{t:'Amount',n:1},{t:'Dup'}],
 Array.from({length:12},(_,i)=>{const b=pick(BR);return[d(rint(1,31)),`${rint(8,20)}:${String(rint(0,59)).padStart(2,'0')}`,b.code,`${rint(10,99)}-6100${rint(10000,99999)}`,'Cashier',pick(['Wrong item','Customer cancelled','Discount not applied']),f2(rint(55,420)),i%5===2?chip('Duplicate','c-warn'):''] }))}</div>`;
P.upload=()=>lead('<b>Upload & Reconcile</b> — drop the month\'s source files; the system detects each file type and runs reconciliation.')+
 `<div class="card"><div class="drop"><b>Drag & drop files here</b><br>Bank statement · IVxGL · POS Payment · Grab · LINE MAN · ShopeeFood · Voucher<br><br>${B('Choose files','pri')}</div></div>
 <div class="card"><h3>Detected files</h3>${table([{t:'File'},{t:'Detected as'},{t:'Period'},{t:'Rows',n:1},{t:'Status'}],[
 ['statement_oct.xlsx','Bank statement','01–31 Oct','13,611',chip('Ready','c-ok')],['ivxgl_oct.xlsx','IVxGL (GL)','01–31 Oct','4,510',chip('Ready','c-ok')],['pos_payment_oct.xlsx','POS Payment','01–31 Oct','5,402',chip('Ready','c-ok')],
 ['grab_oct.csv','Grab','01–31 Oct','28,940',chip('Ready','c-ok')],['lineman_oct.xlsx','LINE MAN','01–31 Oct','9,118',chip('Ready','c-ok')],['shopee_oct.xlsx','ShopeeFood','01–31 Oct','—',chip('Missing','c-warn')]])}
 <div class="bar" style="margin-top:12px">${B('Run reconciliation','pri')}<span class="muted small">Takes ~1 minute · result appears in Results</span></div></div>`;
P.ivxgl=()=>lead('<b>IVxGL vs POS</b> — compares tax invoices posted to GL with POS payments per branch, per day, per payment type.')+
 kpis([['Branch-days','5,402'],['Matched','5,311','98.3%','#059669'],['Diff','91','','#B91C1C'],['Missing invoice','14','','#B45309']])+
